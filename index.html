<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyTube</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='6' width='30' height='20' rx='6' fill='%23ff0033'/%3E%3Cpath d='M13 11v10l9-5z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn menu-toggle" id="menu-toggle" aria-label="メニュー">☰</button>
      <a href="#/" class="logo"><span class="logo-icon">▶</span><span class="logo-text">MyTube</span></a>
    </div>
    <form id="search-form" class="search" role="search">
      <input id="search-input" type="search" placeholder="検索（/ キーで移動）" maxlength="100" autocomplete="off">
      <button type="submit" aria-label="検索">🔍</button>
    </form>
    <div class="top-actions" id="top-actions"></div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="メインメニュー"></nav>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main id="app"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/util.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/subscribe.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/feed.js"></script>
  <script src="js/pages/watch.js"></script>
  <script src="js/pages/upload.js"></script>
  <script src="js/pages/channel.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
